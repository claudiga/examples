<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Togo News</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #15181d;
    --muted: #666e7a;
    --line: #e3e6ea;
    --accent: #006a4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101215;
      --card: #191c21;
      --text: #eef1f4;
      --muted: #9aa3ae;
      --line: #2a2f36;
      --accent: #3ec99b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 56px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  button {
    width: 100%;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { margin: 18px 0 0; color: var(--muted); font-size: 14px; }
  ol { list-style: none; margin: 24px 0 0; padding: 0; }
  li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex;
    gap: 14px;
  }
  .num { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Togo &mdash; Today's News</h1>
  <p class="sub">The 5 latest headlines from Togo.</p>
  <button id="go">Get the news</button>
  <p id="status"></p>
  <ol id="list"></ol>
</main>
<script>
  // English-language coverage of Togo is thinner than French, so widen the
  // window if a single day doesn't turn up five stories.
  const FEEDS = [
    "https://news.google.com/rss/search?q=Togo+when:1d&hl=en-US&gl=US&ceid=US:en",
    "https://news.google.com/rss/search?q=Togo+when:7d&hl=en-US&gl=US&ceid=US:en"
  ];
  // Browsers block cross-origin reads of the feed, so go through a CORS relay.
  const RELAYS = [
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
    u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
  ];

  const btn = document.getElementById("go");
  const status = document.getElementById("status");
  const list = document.getElementById("list");

  function ago(date) {
    const mins = Math.round((Date.now() - date.getTime()) / 60000);
    if (!isFinite(mins) || mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    return Math.round(hrs / 24) + "d ago";
  }

  function render(items) {
    list.innerHTML = "";
    items.slice(0, 5).forEach((item, i) => {
      const title = (item.querySelector("title")?.textContent || "").replace(/\s+-\s+[^-]+$/, "");
      const link = item.querySelector("link")?.textContent || "#";
      const source = item.querySelector("source")?.textContent || "";
      const pub = new Date(item.querySelector("pubDate")?.textContent || "");
      const li = document.createElement("li");
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;
      const body = document.createElement("div");
      const a = document.createElement("a");
      a.href = link;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = title;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [source, isNaN(pub) ? "" : ago(pub)].filter(Boolean).join(" · ");
      body.append(a, meta);
      li.append(num, body);
      list.append(li);
    });
  }

  async function fetchFeed(url) {
    for (const relay of RELAYS) {
      try {
        const res = await fetch(relay(url), { cache: "no-store" });
        if (!res.ok) continue;
        const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
        const items = [...xml.querySelectorAll("item")];
        if (items.length) return items;
      } catch (e) { /* try the next relay */ }
    }
    return [];
  }

  async function load() {
    btn.disabled = true;
    status.textContent = "Loading\u2026";
    list.innerHTML = "";
    let items = [];
    for (const feed of FEEDS) {
      const found = await fetchFeed(feed);
      if (found.length > items.length) items = found;
      if (items.length >= 5) break;
    }
    if (items.length) {
      render(items);
      status.textContent = "Updated " + new Date().toLocaleTimeString("en-US");
      btn.textContent = "Refresh";
    } else {
      status.textContent = "Couldn't load the news. Try again in a moment.";
    }
    btn.disabled = false;
  }

  btn.addEventListener("click", load);
</script>
</body>
</html>
