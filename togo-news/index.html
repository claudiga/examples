<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Togo News</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #15181d;
    --muted: #666e7a;
    --line: #e3e6ea;
    --accent: #006a4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101215;
      --card: #191c21;
      --text: #eef1f4;
      --muted: #9aa3ae;
      --line: #2a2f36;
      --accent: #3ec99b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 56px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  button {
    width: 100%;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { margin: 18px 0 0; color: var(--muted); font-size: 14px; }
  ol { list-style: none; margin: 24px 0 0; padding: 0; }
  li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex;
    gap: 14px;
  }
  .num { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Togo &mdash; l'actu du jour</h1>
  <p class="sub">Les 5 derniers titres sur le Togo.</p>
  <button id="go">Voir les news</button>
  <p id="status"></p>
  <ol id="list"></ol>
</main>
<script>
  const FEED = "https://news.google.com/rss/search?q=Togo+when:1d&hl=fr&gl=TG&ceid=TG:fr";
  // Browsers block cross-origin reads of the feed, so go through a CORS relay.
  const RELAYS = [
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
    u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
  ];

  const btn = document.getElementById("go");
  const status = document.getElementById("status");
  const list = document.getElementById("list");

  function ago(date) {
    const mins = Math.round((Date.now() - date.getTime()) / 60000);
    if (!isFinite(mins) || mins < 1) return "à l'instant";
    if (mins < 60) return "il y a " + mins + " min";
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return "il y a " + hrs + " h";
    return "il y a " + Math.round(hrs / 24) + " j";
  }

  function render(items) {
    list.innerHTML = "";
    items.slice(0, 5).forEach((item, i) => {
      const title = (item.querySelector("title")?.textContent || "").replace(/\s+-\s+[^-]+$/, "");
      const link = item.querySelector("link")?.textContent || "#";
      const source = item.querySelector("source")?.textContent || "";
      const pub = new Date(item.querySelector("pubDate")?.textContent || "");
      const li = document.createElement("li");
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;
      const body = document.createElement("div");
      const a = document.createElement("a");
      a.href = link;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = title;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [source, isNaN(pub) ? "" : ago(pub)].filter(Boolean).join(" · ");
      body.append(a, meta);
      li.append(num, body);
      list.append(li);
    });
  }

  async function load() {
    btn.disabled = true;
    status.textContent = "Chargement…";
    list.innerHTML = "";
    for (const relay of RELAYS) {
      try {
        const res = await fetch(relay(FEED), { cache: "no-store" });
        if (!res.ok) continue;
        const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
        const items = [...xml.querySelectorAll("item")];
        if (!items.length) continue;
        render(items);
        status.textContent = "Mis à jour " + new Date().toLocaleTimeString("fr-FR");
        btn.disabled = false;
        btn.textContent = "Rafraîchir";
        return;
      } catch (e) { /* essaie le relais suivant */ }
    }
    status.textContent = "Impossible de charger les news. Réessaie dans un instant.";
    btn.disabled = false;
  }

  btn.addEventListener("click", load);
</script>
</body>
</html>
